<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon_green.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monastery360</title>
    <meta name="description" content="Monastery360 is a digital heritage platform for Sikkim's monasteries. Take 360° virtual tours of Rumtek, Pemayangtse, Tashiding and Enchey, chat with an AI monastery guide, and help preserve these sites by reporting conservation issues directly to Sikkim's Department of Cultural Affairs & Heritage.">
    <meta name="keywords" content="Sikkim monasteries, Monastery360, Rumtek Monastery, Pemayangtse Monastery, Tashiding Monastery, Enchey Monastery, Sikkim tourism, Buddhist heritage, virtual tour, cultural preservation">
    <meta name="author" content="Monastery360 Team">
    <meta name="theme-color" content="#7a1f2b">
    <link rel="manifest" href="/manifest.webmanifest">

    <!--
      og:url and og:image are relative here since there's no production
      domain yet. Once deployed, set og:url to the real page URL and swap
      og:image/twitter:image to an absolute URL — most social crawlers
      (Facebook's in particular) don't reliably resolve relative image URLs.
    -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Monastery360">
    <meta property="og:title" content="Monastery360 — Digital Heritage Platform for Sikkim's Monasteries">
    <meta property="og:description" content="Take 360° virtual tours of Rumtek, Pemayangtse, Tashiding and Enchey, chat with an AI monastery guide, and help preserve these sites by reporting conservation issues.">
    <meta property="og:image" content="/vr-assets/rumtek-monastery.jpg">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="853">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Monastery360 — Digital Heritage Platform for Sikkim's Monasteries">
    <meta name="twitter:description" content="Take 360° virtual tours of Rumtek, Pemayangtse, Tashiding and Enchey, chat with an AI monastery guide, and help preserve these sites by reporting conservation issues.">
    <meta name="twitter:image" content="/vr-assets/rumtek-monastery.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
